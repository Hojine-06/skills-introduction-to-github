<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande d'emploi</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="form-page">
    <header>
        <h1>Demande d'emploi</h1>
    </header>
    <main>
        <form method="post" action="exemple6.5.php" class="form-container">
            <fieldset>
                <legend>Identité</legend>
                <label for="nom">Nom :</label>
                <input type="text" id="nom" name="ident[]" required>
                <label for="prenom">Prénom :</label>
                <input type="text" id="prenom" name="ident[]" required>
                <label for="age">Âge :</label>
                <input type="number" id="age" name="ident[]" step="1" required>
            </fieldset>
            <fieldset>
                <legend>Langues pratiquées</legend>
                <label for="langues">Sélectionnez vos langues :</label>
                <select id="langues" name="lang[]" multiple="multiple" required>
                    <option value="français">Français</option>
                    <option value="anglais">Anglais</option>
                    <option value="allemand">Allemand</option>
                    <option value="espagnol">Espagnol</option>
                </select>
            </fieldset>
            <fieldset>
                <legend>Compétences informatiques</legend>
                <label>Choisissez vos compétences :</label>
                <input type="checkbox" name="competent[]" value="HTML 5"> HTML 5
                <input type="checkbox" name="competent[]" value="CSS 3"> CSS 3
                <input type="checkbox" name="competent[]" value="PHP"> PHP
                <input type="checkbox" name="competent[]" value="MySQL"> MySQL
            </fieldset>
            <button type="reset">EFFACER</button>
            <button type="submit">ENVOI</button>
        </form>
    </main>
    <footer>
        <p>© 2025 Mon Site Web. Tous droits réservés.</p>
    </footer>
</body>
</html>
