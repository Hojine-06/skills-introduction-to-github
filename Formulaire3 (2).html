<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'adhésion - Club d'Échecs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="form-page">
    <header>
        <h1>Formulaire d'adhésion - Club d'Échecs</h1>
    </header>
    <main>
        <form id="adhesionForm" action="traitement.php" method="post" class="form-container">
            <fieldset>
                <legend>Informations personnelles</legend>
                <label for="nom">Nom :</label>
                <input type="text" id="nom" name="nom" required>
                <label for="prenom">Prénom :</label>
                <input type="text" id="prenom" name="prenom" required>
                <label for="date_naissance">Date de naissance :</label>
                <input type="date" id="date_naissance" name="date_naissance" required>
                <label for="telephone">Numéro de téléphone :</label>
                <input type="tel" id="telephone" name="telephone">
            </fieldset>
            <fieldset>
                <legend>Centres d'intérêt et niveau</legend>
                <label>Centres d'intérêt :</label>
                <input type="checkbox" name="centres[]" value="compétition"> Compétition
                <input type="checkbox" name="centres[]" value="casual"> Jeu casual
                <input type="checkbox" name="centres[]" value="formation"> Formation
                <input type="checkbox" name="centres[]" value="spectateur"> Spectateur
                <label>Niveau de jeu :</label>
                <input type="radio" name="niveau" value="débutant"> Débutant
                <input type="radio" name="niveau" value="intermédiaire"> Intermédiaire
                <input type="radio" name="niveau" value="confirmé"> Confirmé
            </fieldset>
            <fieldset>
                <legend>Vos motivations</legend>
                <label for="motivations">Motivations :</label>
                <textarea id="motivations" name="motivations" rows="4"></textarea>
            </fieldset>
            <button type="submit">S'inscrire</button>
        </form>
    </main>
    <footer>
        <p>© 2025 Club d'Échecs. Tous droits réservés.</p>
    </footer>
</body>
</html>
